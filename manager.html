<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi Telegram Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .controls {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 5px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .instances-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .instance-card {
            background: white;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .instance-card:hover {
            transform: translateY(-5px);
        }

        .instance-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .instance-id {
            font-weight: bold;
            color: #667eea;
            font-size: 1.1rem;
        }

        .instance-status {
            background: #4CAF50;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
        }

        .instance-info {
            margin-bottom: 15px;
        }

        .instance-info div {
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .instance-actions {
            display: flex;
            gap: 10px;
        }

        .btn-small {
            background: #f44336;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .btn-small:hover {
            background: #d32f2f;
        }

        .stats {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .stat-item {
            text-align: center;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 5px;
        }

        .no-instances {
            text-align: center;
            color: #666;
            font-style: italic;
            margin: 40px 0;
        }

        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Multi Telegram Manager</h1>
            <p>Управление множественными экземплярами Telegram</p>
        </div>

        <div class="stats">
            <div class="stats-grid">
                <div class="stat-item">
                    <div class="stat-number" id="total-instances">0</div>
                    <div class="stat-label">Активных экземпляров</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="memory-usage">—</div>
                    <div class="stat-label">Использование памяти</div>
                </div>
                <div class="stat-item">
                    <div class="stat-number" id="uptime">—</div>
                    <div class="stat-label">Время работы</div>
                </div>
            </div>
        </div>

        <div class="controls">
            <h2>Управление экземплярами</h2>
            <button class="btn" onclick="createNewInstance()">
                ➕ Создать новый экземпляр Telegram
            </button>
            <button class="btn" onclick="refreshInstances()">
                🔄 Обновить список
            </button>
            <button class="btn" onclick="closeAllInstances()">
                ❌ Закрыть все экземпляры
            </button>
        </div>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Создание экземпляра...</p>
        </div>

        <div id="instances-container">
            <div class="no-instances">
                Нет активных экземпляров. Создайте новый экземпляр для начала работы.
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        let instances = [];
        let startTime = new Date();

        // Обновление времени работы
        setInterval(() => {
            const uptime = Math.floor((new Date() - startTime) / 1000);
            const hours = Math.floor(uptime / 3600);
            const minutes = Math.floor((uptime % 3600) / 60);
            const seconds = uptime % 60;
            document.getElementById('uptime').textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }, 1000);

        async function createNewInstance() {
            const loading = document.getElementById('loading');
            loading.style.display = 'block';

            try {
                const result = await ipcRenderer.invoke('create-telegram-instance');
                console.log('Создан новый экземпляр:', result);
                await refreshInstances();
            } catch (error) {
                console.error('Ошибка создания экземпляра:', error);
                alert('Ошибка при создании экземпляра: ' + error.message);
            } finally {
                loading.style.display = 'none';
            }
        }

        async function refreshInstances() {
            try {
                const instanceIds = await ipcRenderer.invoke('get-instances');
                instances = instanceIds;
                updateInstancesDisplay();
                updateStats();
            } catch (error) {
                console.error('Ошибка получения экземпляров:', error);
            }
        }

        async function closeInstance(instanceId) {
            try {
                const result = await ipcRenderer.invoke('close-instance', instanceId);
                if (result) {
                    await refreshInstances();
                }
            } catch (error) {
                console.error('Ошибка закрытия экземпляра:', error);
            }
        }

        async function closeAllInstances() {
            if (instances.length === 0) return;
            
            if (confirm(`Вы уверены, что хотите закрыть все ${instances.length} экземпляров?`)) {
                for (const instanceId of instances) {
                    await closeInstance(instanceId);
                }
            }
        }

        function updateInstancesDisplay() {
            const container = document.getElementById('instances-container');
            
            if (instances.length === 0) {
                container.innerHTML = '<div class="no-instances">Нет активных экземпляров. Создайте новый экземпляр для начала работы.</div>';
                return;
            }

            const grid = document.createElement('div');
            grid.className = 'instances-grid';

            instances.forEach((instanceId, index) => {
                const card = document.createElement('div');
                card.className = 'instance-card';
                
                const shortId = instanceId.slice(0, 8);
                const createTime = new Date().toLocaleTimeString();
                
                card.innerHTML = `
                    <div class="instance-header">
                        <div class="instance-id">Instance #${index + 1}</div>
                        <div class="instance-status">Активен</div>
                    </div>
                    <div class="instance-info">
                        <div><strong>ID:</strong> ${shortId}...</div>
                        <div><strong>URL:</strong> web.telegram.org</div>
                        <div><strong>Создан:</strong> ${createTime}</div>
                    </div>
                    <div class="instance-actions">
                        <button class="btn-small" onclick="closeInstance('${instanceId}')">
                            Закрыть
                        </button>
                    </div>
                `;
                
                grid.appendChild(card);
            });

            container.innerHTML = '';
            container.appendChild(grid);
        }

        function updateStats() {
            document.getElementById('total-instances').textContent = instances.length;
            
            // Примерный расчет использования памяти (каждый экземпляр ~100MB)
            const memoryMB = instances.length * 100;
            document.getElementById('memory-usage').textContent = memoryMB > 0 ? `~${memoryMB}MB` : '—';
        }

        // Загружаем данные при запуске
        document.addEventListener('DOMContentLoaded', () => {
            refreshInstances();
        });

        // Обновляем данные каждые 5 секунд
        setInterval(refreshInstances, 5000);
    </script>
</body>
</html>
